# SoftGlow dev stack: Postgres + API + admin dashboard. See README.md.
#
#   cp apps/api/.env.example apps/api/.env      # once; add GEMINI_API_KEY
#   docker compose up -d --build
#
# The mobile app is best run directly on your computer (`pnpm --filter
# @softglow/mobile start`), not in Docker. A Docker version is available with
# `docker compose --profile mobile up -d mobile` but needs Expo's tunnel.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_* here must match what the API uses (see the api command below).
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-softglow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-softglow}
      POSTGRES_DB: ${POSTGRES_DB:-softglow}
    volumes:
      - softglow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-softglow} -d $${POSTGRES_DB:-softglow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Exposed on 127.0.0.1:5433 (not 5432) so it doesn't clash with a Postgres
    # already installed on the computer. Only needed for running the API or a
    # DB tool outside Docker; set DB_HOST_PORT in a root .env to change it.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside Docker the database is always the `db` service, whatever host
      # DATABASE_URL in .env names (it points at localhost for running outside
      # Docker). Applies to every command in this container, incl. scripts.
      DATABASE_HOST: db
    # Run pending migrations then start the server.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - softglow_media:/app/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Reach the api container by service name instead of localhost.
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/admin:/app/apps/admin
      - ./packages:/app/packages
      - admin_node_modules:/app/apps/admin/node_modules
    ports:
      - "5174:5174"

  mobile:
    # Optional: only starts with `--profile mobile`. Running Expo on the host
    # is simpler and faster (see README.md).
    profiles: ["mobile"]
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Point the app at this host's LAN IP so phones/browsers can reach the
      # API — set this in a root .env file, e.g. HOST_LAN_IP=192.168.1.23.
      EXPO_PUBLIC_API_URL: http://${HOST_LAN_IP:-localhost}:8000/api/v1
    volumes:
      - ./apps/mobile:/app/apps/mobile
      - ./packages:/app/packages
      - mobile_node_modules:/app/apps/mobile/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    stdin_open: true
    tty: true

volumes:
  softglow_pg:
  softglow_media:
  admin_node_modules:
  mobile_node_modules:
